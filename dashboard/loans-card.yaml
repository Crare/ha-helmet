# Markdown card listing the loans of every Helmet library card added to
# Home Assistant, with due dates. No editing needed: it finds the sensors itself.
type: markdown
title: Library loans
content: |-
  {%- set ns = namespace(ids=[]) -%}
  {%- for id in integration_entities('helmet') | sort -%}
  {%- if state_attr(id, 'loans') is not none %}{% set ns.ids = ns.ids + [id] %}{% endif -%}
  {%- endfor -%}
  {%- for id in ns.ids -%}
  {%- set name = (state_attr(id, 'friendly_name') or id) | replace(' Loans', '') | replace(' Lainat', '') -%}
  {%- set loans = state_attr(id, 'loans') or [] %}

  ### {{ name }} ({{ loans | count }})

  {% if loans -%}
  | Title | Due | |
  |:--|:--|:--|
  {% for l in loans -%}
  {%- if l.due_date -%}
  {%- set due = strptime(l.due_date, '%Y-%m-%d') -%}
  {%- set days = (due.date() - now().date()).days -%}
  | {{ l.title }} | {{ due.strftime('%-d.%-m.%Y') }} | {% if days < 0 %}🔴 overdue{% elif days == 0 %}🟠 today{% elif days <= 3 %}🟠 {{ days }} d{% else %}{{ days }} d{% endif %} |
  {% else -%}
  | {{ l.title }} | – | |
  {% endif -%}
  {%- endfor -%}
  {%- else -%}
  No loans
  {%- endif %}
  {% else -%}
  No Helmet library cards found. Add one under Settings → Devices & services.
  {%- endfor -%}
