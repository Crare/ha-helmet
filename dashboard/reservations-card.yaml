# Markdown card listing the reservations of every Helmet library card added to
# Home Assistant; ready ones first with the last pickup day. No editing needed.
type: markdown
title: Library reservations
content: |-
  {%- set ns = namespace(ids=[]) -%}
  {%- for id in integration_entities('helmet') | sort -%}
  {%- if state_attr(id, 'holds') is not none and state_attr(id, 'waiting') is none %}{% set ns.ids = ns.ids + [id] %}{% endif -%}
  {%- endfor -%}
  {%- for id in ns.ids -%}
  {%- set name = (state_attr(id, 'friendly_name') or id) | replace(' Reservations', '') | replace(' Varaukset', '') -%}
  {%- set holds = state_attr(id, 'holds') or [] %}

  ### {{ name }} ({{ holds | count }})

  {% if holds -%}
  | Title | Status |
  |:--|:--|
  {% for h in holds -%}
  {%- if h.ready -%}
  | **{{ h.title }}**{% if h.pickup_location %}<br>📍 {{ h.pickup_location.split(' / ')[0] }}{% endif %} | 📚 Ready{% if h.pickup_by %}, pick up by {{ strptime(h.pickup_by, '%Y-%m-%d').strftime('%-d.%-m.') }}{% endif %} |
  {% else -%}
  | {{ h.title }}{% if h.pickup_location %}<br>📍 {{ h.pickup_location.split(' / ')[0] }}{% endif %} | ⏳ In queue{% if h.queue_position %}, #{{ h.queue_position }}{% if h.queue_length %} of {{ h.queue_length }}{% endif %}{% endif %} |
  {% endif -%}
  {%- endfor -%}
  {%- else -%}
  No reservations
  {%- endif %}
  {% else -%}
  No Helmet library cards found. Add one under Settings → Devices & services.
  {%- endfor -%}
